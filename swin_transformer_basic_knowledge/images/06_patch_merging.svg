<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Patch Merging 合并过程</title><desc id="desc">四个相邻 C 维 token 拼接成 4C，经过 LayerNorm 和线性映射压缩成一个 2C 维新 token。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.t{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.arr{stroke:#475569;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="430" fill="#f8fafc"/><text x="550" y="38" text-anchor="middle" class="t">Patch Merging：四个相邻 token 合成一个新 token</text>
  <g transform="translate(55 100)"><text x="125" y="-20" text-anchor="middle" class="h">相邻 2 × 2 tokens</text><rect x="0" y="0" width="115" height="115" fill="#bfdbfe" stroke="#2563eb"/><rect x="125" y="0" width="115" height="115" fill="#bbf7d0" stroke="#16a34a"/><rect x="0" y="125" width="115" height="115" fill="#fde68a" stroke="#d97706"/><rect x="125" y="125" width="115" height="115" fill="#e9d5ff" stroke="#9333ea"/><g class="h" text-anchor="middle"><text x="57" y="55">token 1</text><text x="57" y="80" class="s">C 维</text><text x="182" y="55">token 2</text><text x="182" y="80" class="s">C 维</text><text x="57" y="180">token 3</text><text x="57" y="205" class="s">C 维</text><text x="182" y="180">token 4</text><text x="182" y="205" class="s">C 维</text></g></g>
  <line class="arr" x1="315" y1="220" x2="390" y2="220"/><text x="352" y="196" text-anchor="middle" class="s">拼接</text>
  <g transform="translate(410 130)"><rect width="165" height="180" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="82" y="48" text-anchor="middle" class="h">4C 维</text><text x="82" y="86" text-anchor="middle" class="s">保留四个位置</text><text x="82" y="112" text-anchor="middle" class="s">的特征来源</text><text x="82" y="152" text-anchor="middle" class="h">LayerNorm</text></g>
  <line class="arr" x1="590" y1="220" x2="665" y2="220"/><text x="627" y="196" text-anchor="middle" class="s">线性映射</text>
  <g transform="translate(685 145)"><rect width="155" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="77" y="52" text-anchor="middle" class="h">新 token</text><text x="77" y="88" text-anchor="middle" class="t">2C 维</text><text x="77" y="122" text-anchor="middle" class="s">学习怎样提炼</text></g>
  <line class="arr" x1="855" y1="220" x2="915" y2="220"/>
  <g transform="translate(930 145)"><text x="70" y="15" text-anchor="middle" class="h">shape 结果</text><text x="70" y="58" text-anchor="middle" class="h">H / 2</text><text x="70" y="88" text-anchor="middle" class="h">W / 2</text><text x="70" y="118" text-anchor="middle" class="h">2C</text></g>
  <text x="550" y="395" text-anchor="middle" class="s">示例：56 × 56 × 96 → 28 × 28 × 192</text>
</svg>
