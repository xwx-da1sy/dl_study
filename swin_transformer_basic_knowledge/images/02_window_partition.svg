<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Window Attention 的窗口划分</title><desc id="desc">将四乘四 token 网格划分成四个二乘二窗口，再把每个窗口展平为局部序列。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.t{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px}.cell{stroke:#fff;stroke-width:2}.arr{stroke:#475569;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1000" height="470" fill="#f8fafc"/><text x="500" y="38" text-anchor="middle" class="t">固定窗口：先分组，再在每组内部做 Attention</text>
  <text x="210" y="80" text-anchor="middle" class="h">4 × 4 token 网格</text>
  <g transform="translate(70 100)">
    <g fill="#bfdbfe"><rect class="cell" x="0" y="0" width="70" height="70"/><rect class="cell" x="70" y="0" width="70" height="70"/><rect class="cell" x="0" y="70" width="70" height="70"/><rect class="cell" x="70" y="70" width="70" height="70"/></g>
    <g fill="#bbf7d0"><rect class="cell" x="140" y="0" width="70" height="70"/><rect class="cell" x="210" y="0" width="70" height="70"/><rect class="cell" x="140" y="70" width="70" height="70"/><rect class="cell" x="210" y="70" width="70" height="70"/></g>
    <g fill="#fde68a"><rect class="cell" x="0" y="140" width="70" height="70"/><rect class="cell" x="70" y="140" width="70" height="70"/><rect class="cell" x="0" y="210" width="70" height="70"/><rect class="cell" x="70" y="210" width="70" height="70"/></g>
    <g fill="#e9d5ff"><rect class="cell" x="140" y="140" width="70" height="70"/><rect class="cell" x="210" y="140" width="70" height="70"/><rect class="cell" x="140" y="210" width="70" height="70"/><rect class="cell" x="210" y="210" width="70" height="70"/></g>
    <path d="M140 0V280M0 140H280" stroke="#0f172a" stroke-width="5"/>
    <text x="70" y="78" text-anchor="middle" class="h">A</text><text x="210" y="78" text-anchor="middle" class="h">B</text><text x="70" y="218" text-anchor="middle" class="h">C</text><text x="210" y="218" text-anchor="middle" class="h">D</text>
  </g>
  <line class="arr" x1="390" y1="240" x2="505" y2="240"/><text x="448" y="218" text-anchor="middle" class="s">每个窗口展平</text>
  <g transform="translate(540 100)">
    <text x="170" y="-20" text-anchor="middle" class="h">四条局部序列</text>
    <rect x="0" y="0" width="340" height="55" rx="10" fill="#bfdbfe"/><text x="170" y="34" text-anchor="middle" class="h">A1　A2　A3　A4</text>
    <rect x="0" y="70" width="340" height="55" rx="10" fill="#bbf7d0"/><text x="170" y="104" text-anchor="middle" class="h">B1　B2　B3　B4</text>
    <rect x="0" y="140" width="340" height="55" rx="10" fill="#fde68a"/><text x="170" y="174" text-anchor="middle" class="h">C1　C2　C3　C4</text>
    <rect x="0" y="210" width="340" height="55" rx="10" fill="#e9d5ff"/><text x="170" y="244" text-anchor="middle" class="h">D1　D2　D3　D4</text>
  </g>
  <text x="500" y="440" text-anchor="middle" class="s">窗口之间暂不交流；所有窗口共享同一套 Attention 参数</text>
</svg>
