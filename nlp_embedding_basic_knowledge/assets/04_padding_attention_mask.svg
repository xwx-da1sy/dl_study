    <rect x="460" y="468" width="58" height="48" rx="9" fill="#64ae7b"/><text x="489" y="500" fill="#ffffff">1</text>
    <rect x="530" y="468" width="58" height="48" rx="9" fill="#64ae7b"/><text x="559" y="500" fill="#ffffff">1</text>
