  <text x="500" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#647b8d">补齐</text>

  <text x="770" y="118" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17324d">统一为长度 5</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17324d">
    <text x="555" y="190" font-family="Microsoft YaHei, sans-serif" fill="#647b8d">A</text>
    <rect x="595" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="624" y="191">2</text>
    <rect x="665" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="694" y="191">3</text>
    <rect x="735" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="764" y="191">5</text>
    <rect x="805" y="155" width="58" height="55" rx="10" fill="#e1e7eb"/><text x="834" y="191" fill="#7b8b96">0</text>
    <rect x="875" y="155" width="58" height="55" rx="10" fill="#e1e7eb"/><text x="904" y="191" fill="#7b8b96">0</text>
