  <text x="790" y="495" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#549569">1：有效位置</text>
  <text x="790" y="536" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7b8b96">0：忽略位置</text>
