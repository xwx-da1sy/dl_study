    <rect x="595" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="624" y="281">2</text>
    <rect x="665" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="694" y="281">3</text>
    <rect x="735" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="764" y="281">4</text>
    <rect x="805" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="834" y="281">5</text>
    <rect x="875" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="904" y="281">6</text>
  </g>
  <text x="1035" y="172" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#7b8b96">灰色 = [PAD]</text>

  <line x1="770" y1="325" x2="770" y2="380" stroke="#49657a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="845" y="358" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#647b8d">生成 Mask</text>

  <rect x="315" y="405" width="570" height="175" rx="22" fill="#ffffff" stroke="#b7cad8" stroke-width="3"/>
  <text x="600" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17324d">Attention Mask</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
