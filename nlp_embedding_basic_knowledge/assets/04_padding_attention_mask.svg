    <rect x="390" y="525" width="58" height="48" rx="9" fill="#64ae7b"/><text x="419" y="557" fill="#ffffff">1</text>
    <rect x="460" y="525" width="58" height="48" rx="9" fill="#64ae7b"/><text x="489" y="557" fill="#ffffff">1</text>
    <rect x="530" y="525" width="58" height="48" rx="9" fill="#64ae7b"/><text x="559" y="557" fill="#ffffff">1</text>
    <rect x="600" y="525" width="58" height="48" rx="9" fill="#64ae7b"/><text x="629" y="557" fill="#ffffff">1</text>
    <rect x="670" y="525" width="58" height="48" rx="9" fill="#64ae7b"/><text x="699" y="557" fill="#ffffff">1</text>
