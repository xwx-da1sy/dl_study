<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#49657a"/></marker></defs>
  <rect width="1200" height="650" rx="28" fill="#f6f9fc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#17324d">Padding 对齐长度，Attention Mask 标记有效位置</text>

  <text x="190" y="118" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17324d">原始 ID 序列</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17324d">
    <text x="50" y="190" font-family="Microsoft YaHei, sans-serif" fill="#647b8d">A</text>
    <rect x="90" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="119" y="191">2</text>
    <rect x="160" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="189" y="191">3</text>
    <rect x="230" y="155" width="58" height="55" rx="10" fill="#d9f0ff"/><text x="259" y="191">5</text>
    <text x="50" y="280" font-family="Microsoft YaHei, sans-serif" fill="#647b8d">B</text>
    <rect x="90" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="119" y="281">2</text>
    <rect x="160" y="245" width="58" height="55" rx="10" fill="#e5f6ea"/><text x="189" y="281">3</text>
