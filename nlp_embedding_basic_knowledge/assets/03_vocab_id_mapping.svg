<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#49657a"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="610" rx="28" fill="#f6f9fc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#17324d">词表把 Token 映射为整数地址</text>

  <rect x="60" y="145" width="270" height="300" rx="24" fill="#ffffff" stroke="#b7cad8" stroke-width="3" filter="url(#shadow)"/>
  <text x="195" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#647b8d">Token 序列</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <rect x="105" y="220" width="180" height="48" rx="12" fill="#d9f0ff"/><text x="195" y="251" fill="#17324d">我</text>
    <rect x="105" y="282" width="180" height="48" rx="12" fill="#e5f6ea"/><text x="195" y="313" fill="#17324d">喜欢</text>
    <rect x="105" y="344" width="180" height="48" rx="12" fill="#fff0ce"/><text x="195" y="375" fill="#17324d">学习</text>
  </g>

  <line x1="345" y1="295" x2="420" y2="295" stroke="#49657a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="435" y="105" width="330" height="380" rx="24" fill="#ffffff" stroke="#286f9c" stroke-width="4" filter="url(#shadow)"/>
  <rect x="435" y="105" width="330" height="65" rx="20" fill="#286f9c"/>
  <text x="600" y="147" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Vocabulary 词表</text>
  <g font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#17324d">
    <text x="490" y="214" font-weight="700">Token</text><text x="680" y="214" text-anchor="middle" font-weight="700">ID</text>
    <line x1="470" y1="232" x2="730" y2="232" stroke="#b7cad8" stroke-width="2"/>
    <text x="490" y="270">[PAD]</text><text x="680" y="270" text-anchor="middle">0</text>
    <text x="490" y="312">[UNK]</text><text x="680" y="312" text-anchor="middle">1</text>
    <text x="490" y="354">我</text><text x="680" y="354" text-anchor="middle">2</text>
    <text x="490" y="396">喜欢</text><text x="680" y="396" text-anchor="middle">3</text>
    <text x="490" y="438">学习</text><text x="680" y="438" text-anchor="middle">5</text>
  </g>

  <line x1="780" y1="295" x2="855" y2="295" stroke="#49657a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="870" y="175" width="270" height="240" rx="24" fill="#ffffff" stroke="#b7cad8" stroke-width="3" filter="url(#shadow)"/>
  <text x="1005" y="220" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#647b8d">Token ID 序列</text>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#17324d">
    <rect x="910" y="270" width="55" height="65" rx="12" fill="#d9f0ff"/><text x="937" y="312">2</text>
    <rect x="978" y="270" width="55" height="65" rx="12" fill="#e5f6ea"/><text x="1005" y="312">3</text>
    <rect x="1046" y="270" width="55" height="65" rx="12" fill="#fff0ce"/><text x="1073" y="312">5</text>
  </g>

  <rect x="190" y="520" width="820" height="58" rx="17" fill="#fff4d8" stroke="#e1b555" stroke-width="2"/>
  <text x="600" y="557" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#755116">ID 是查找位置的地址：数字大小与 Token 的语义大小无关</text>
</svg>
